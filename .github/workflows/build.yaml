# Compila e publica as imagens do add-on no GitHub Container Registry, para o
# Home Assistant baixar pronta em vez de compilar na instalação.
#
# Fluxo de release (evita o HA ver uma versão cuja imagem ainda não existe):
#   1. aumente "version" em elc6012_mqtt/config.yaml num branch "release";
#   2. git push origin release   -> este workflow publica as imagens;
#   3. com o workflow verde, leve o commit para o master.
name: Build do add-on

on:
  push:
    branches: [release]
    paths: ["elc6012_mqtt/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Versão do add-on
        id: meta
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?/\1/p' elc6012_mqtt/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-elc6012_mqtt" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: elc6012_mqtt
          platforms: ${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.name=ELC 6012 NET
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
